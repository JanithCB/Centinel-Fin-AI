spring.application.name=centinel-fin-ai

# In-Memory Test Database
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=PostgreSQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA/Hibernate Test Config
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect

# Mock Gemini Key for Test context
gemini.api.key=test-gemini-key
gemini.api.model=gemini-2.5-flash

# Test Ingestion API Key
centinel.ingestion.api-key=test-ingestion-secret-key

