$kind: http-request
name: "AUTH-01: Protected endpoint rejects no token"
url: "{{baseURL}}/api/v1/users/purchase-requests/family"
method: GET
scripts:
  - type: afterResponse
    code: "pm.test(\"Security Gate: Unauthenticated request is rejected with 401 Unauthorized\", function () {\r

      \    pm.response.to.have.status(401);\r

      });"
    language: text/javascript
order: 4000
