$kind: http-request
url: "{{supabaseUrl}}/auth/v1/token?grant_type=password"
method: POST
headers:
  - key: apikey
    value: "{{supabaseApiKey}}"
    disabled: false
    description: application/json
queryParams:
  grant_type: password
body:
  type: json
  content: "{\r

    \    \"email\": \"parent.test@example.com\",\r

    \    \"password\": \"Password123!\"\r

    \r

    }\r

    \ "
scripts:
  - type: afterResponse
    code: "pm.test(\"Status code is 200 OK\", function () {\r

      \    pm.response.to.have.status(200); });\r

      \r

      pm.test(\"Parent JWT captured and saved to enviroment variable\", function () {\r

      \    const json = pm.response.json();\r

      \    pm.expect(json).to.have.property(\"access_token\");\r

      \    pm.environment.set(\"parentToken\", json.access_token);\r

      \    console.log(\"Parent token successfully updated !\")\r

      });\r

      \r\n"
    language: text/javascript
order: 1000
