$kind: http-request
url: "{{baseURL}}/api/health"
method: GET
scripts:
  - type: afterResponse
    code: "pm.test(\"Health Status code is 200 OK\", function () {\r

      \    pm.response.to.have.status(200);\r

      });\r

      \r

      pm.test(\"Database is connected and up \", function() {\r

      \    const data = pm.response.json();\r

      \    pm.expect(data.status).to.eql(\"UP\");\r

      \    pm.expect(data.database).to.include(\"Supabase Postgres\");\r

      });\r

      \r

      pm.test(\"Response time is healthy (<500ms)\",function() {\r

      \    pm.expect(pm.response.responseTime).to.be.below(500);\r

      });\r

      \r

      \r

      // ============================================================================\r

      // ⚡ Performance & Defensive Header Audit\r

      // ============================================================================\r

      pm.test(\"Performance SLA: Response completed under 300ms\", function () {\r

      \    pm.expect(pm.response.responseTime).to.be.below(300);\r

      });\r

      pm.test(\"Payload Optimization: Body size is compact (< 2KB)\", function () {\r

      \    pm.expect(pm.response.responseSize).to.be.below(2048);\r

      });\r

      pm.test(\"Defensive Header: X-Content-Type-Options is nosniff\", function () {\r

      \    pm.response.to.have.header(\"x-content-type-options\");\r

      \    pm.expect(pm.response.headers.get(\"x-content-type-options\")).to.eql(\"nosniff\");\r

      });"
    language: text/javascript
order: 1000
