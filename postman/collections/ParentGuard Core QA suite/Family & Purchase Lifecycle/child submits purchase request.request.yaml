$kind: http-request
url: "{{baseURL}}/api/v1/purchase-requests"
method: POST
body:
  type: json
  content: "{\r

    \    \"siteDomain\": \"store.steampowered.com\",\r

    \    \"itemName\": \"Xbox Game Pass 1-Month\",\r

    \    \"amount\": 29.99,\r

    \    \"currency\": \"USD\",\r

    \    \"category\": \"ENTERTAINMENT\",\r

    \    \"note\": \"Weekend gaming with friends\"\r

    \r

    }"
auth:
  type: bearer
  credentials:
    token: "{{childToken}}"
scripts:
  - type: afterResponse
    code: "// 1. Define complete JSON Schema for PurchaseRequestResponseDTO\r

      const purchaseSchema = {\r

      \    \"$schema\": \"http://json-schema.org/draft-07/schema#\",\r

      \    \"title\": \"PurchaseRequestResponseDTO\",\r

      \    \"type\": \"object\",\r

      \    \"required\": [\"id\", \"siteDomain\", \"itemName\", \"amount\", \"currency\", \"status\", \"createdAt\"],\r

      \    \"properties\": {\r

      \        \"id\": {\r

      \            \"type\": \"integer\",\r

      \            \"minimum\": 1\r

      \        },\r

      \        \"siteDomain\": {\r

      \            \"type\": \"string\"\r

      \        },\r

      \        \"itemName\": {\r

      \            \"type\": \"string\",\r

      \            \"minLength\": 1\r

      \        },\r

      \        \"amount\": {\r

      \            \"type\": \"number\",\r

      \            \"minimum\": 0.01\r

      \        },\r

      \        \"currency\": {\r

      \            \"type\": \"string\",\r

      \            \"enum\": [\"USD\", \"EUR\", \"GBP\", \"LKR\"]\r

      \        },\r

      \        \"category\": {\r

      \            \"type\": \"string\"\r

      \        },\r

      \        \"status\": {\r

      \            \"type\": \"string\",\r

      \            \"enum\": [\"PENDING\", \"APPROVED\", \"DENIED\", \"FLAGGED\"]\r

      \        },\r

      \        \"note\": {\r

      \            \"type\": [\"string\", \"null\"]\r

      \        },\r

      \        \"createdAt\": {\r

      \            \"type\": \"string\"\r

      \        }\r

      \    },\r

      \    \"additionalProperties\": true\r

      };\r

      \r

      // 2. Initialize Postman's built-in Ajv validator\r

      const Ajv = require(\"ajv\");\r

      const ajv = new Ajv({ allErrors: true });\r

      \r

      pm.test(\"Schema Integrity: Response strictly adheres to PurchaseRequest JSON Schema\", function () {\r

      \    const responseData = pm.response.json();\r

      \    const validate = ajv.compile(purchaseSchema);\r

      \    const valid = validate(responseData);\r

      \r

      \    if (!valid) {\r

      \        console.error(\"AJV Validation Errors:\", validate.errors);\r

      \    }\r

      \    pm.expect(valid, JSON.stringify(validate.errors)).to.be.true;\r

      });\r

      \r

      // 3. Harvest dynamic ID for downstream lifecycle actions\r

      pm.test(\"Capture dynamic purchase requestId\", function () {\r

      \    const res = pm.response.json();\r

      \    pm.expect(res.status).to.eql(\"PENDING\");\r

      \    pm.environment.set(\"requestId\", res.id);\r

      \    console.log(\"Captured requestId:\", res.id);\r

      });"
    language: text/javascript
order: 4000
